# Air hot-reload config for the Multica Go backend.
# Run from server/: `air` (watches .go files, rebuilds and restarts on save).

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o tmp/server.exe ./cmd/server"
  bin = "tmp/server.exe"
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin"]
  delay = 500
  stop_on_error = false
  send_interrupt = true
  kill_delay = 500

[log]
  time = true
