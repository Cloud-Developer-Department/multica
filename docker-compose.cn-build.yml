# CN build override: build backend/web from checkout using China-friendly Dockerfiles.
services:
  backend:
    image: multica-backend:dev
    build:
      context: .
      dockerfile: Dockerfile.cn
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-unknown}
        DATE: ${DATE:-unknown}

  frontend:
    image: multica-web:dev
    build:
      context: .
      dockerfile: Dockerfile.web.cn
      args:
        REMOTE_API_URL: http://backend:8080
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
        NEXT_PUBLIC_APP_VERSION: dev
